<!DOCTYPE html>
<html>
<head>

<title>Sales History</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<h1>Sales History</h1>

<a href="/">Back to Dashboard</a>

<table>

<tr>
<th>Product</th>
<th>Quantity Sold</th>
<th>Total Price</th>
<th>Date</th>
</tr>

{% for sale in sales %}

<tr>

<td>{{ sale[0] }}</td>
<td>{{ sale[1] }}</td>
<td>{{ sale[2] }}</td>
<td>{{ sale[3] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
